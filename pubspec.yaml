name: brainrot
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Localization
  intl: 0.19.0

  # State Management
  provider: 6.1.2

  # UI Components
  cupertino_icons: 1.0.8

  # Images
  flutter_svg: 2.0.10+1

  # Local Storage
  hive: 2.2.3
  hive_flutter: 1.1.0
  shared_preferences: 2.2.3

  # Navigation
  go_router: 13.2.0

  # Utilities
  equatable: 2.0.5
  uuid: 4.3.3
  lottie: 3.1.2
  flutter_spinkit: 5.2.1

  # Home Screen Widget
  home_widget: 0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 4.0.0
  flutter_launcher_icons: 0.13.1
  intl_utils: 2.8.7

  # Hive code generation
  hive_generator: 2.0.1
  build_runner: 2.4.12


# ==============================
# Flutter Launcher Icons
# ==============================
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/image/logo1.png"
  min_sdk_android: 21


# ==============================
# Flutter
# ==============================
flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/image/
    - assets/animation/
